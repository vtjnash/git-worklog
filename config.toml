# worklog configuration - the shared half.
#
# Two files, read as one. This one is versioned with the program and names
# nobody: every key, its default, and the comment that is its manual. The
# other is `data/config.toml`, yours - written once from `config.user.toml`
# the first time `wl` runs and never touched by the program again.
#
# The merge is two levels deep: a top-level value in your file replaces the
# one here, a top-level table merges key by key, and whatever sits under one
# of those keys replaces whole. So `[thresholds] reply_days` overrides one
# number, `[events] repos` in your file *is* the list, and a `[views."name"]`
# of the same name replaces the view.

# Your GitHub login: how a row is read as yours or not. Set it in
# `data/config.toml`; nothing runs without it. The lanes below do not need
# it, since `@me` in a search is whoever holds the token.
login = ""

# The file under `themes/` the colours come from. Empty, or a file that is
# not there, draws everything plain, with no escapes printed at all. A
# misspelt role or colour inside the file is reported on stderr at startup
# and drawn as nothing; the file itself says what the roles are and how a
# colour is written. Where the terminal says whether it is dark or light
# (VS Code's, tmux 3.6+), a name with `light` or `dark` in it is swapped for
# the file with the other word, when there is one, and follows the terminal
# when it changes.
theme = "github-light-256.toml"

# The zone times are shown in, as an IANA name - `America/New_York`, not
# `-05:00`, so daylight time comes and goes with the zone. A bare date typed
# as a snooze is midnight there. Empty is the zone `wl` was started in: `TZ`,
# or the machine's. Display only: every stamp is stored and compared in UTC.
tz = ""

# The sign of life: once a second the corner of the pane that has the keys
# is redrawn, lit on one tick and quiet on the next, so a quiet screen can be
# told from a stopped program. One cell, written only when no frame is due;
# over a stalled ssh or tmux link the write blocks, so nothing piles up
# behind it. false turns it off.
liveness = true

[thresholds]
# A mention this recent, with the last word not yours, is a question owed a
# reply: the `reply` tag.
reply_days = 30
# Silence this long, in *working* days, wants a second look - the `second`
# tag: the author spoke or pushed and nobody answered, or somebody approved
# it and nothing happened after. It is about an answer being owed, not about
# age, so there is no "stale" threshold and no far end: age alone is not a
# reason to be told about something, and a row that should leave the lane
# leaves it by `s` - a decision, recorded, reversible with `z`.
second_look_days = 2

[lanes]
# GitHub search syntax, one paginated GraphQL search each. The three are the
# open work - what you wrote, what you were asked to review, what you were
# handed - and are fetched whole on every refresh, because that both finds
# the standing set (a pull request nobody has touched notifies nobody) and
# brings back everything the tags are made of - CI, the review threads, the
# draft flag - which change without any clock saying so. Everything else
# arrives through the clocks under `[events]` and is fetched by url only
# when one says it moved; a row nothing returns is `I`, an import. Nothing
# leaves: a finished pull request of yours stays, and so does a mention on a
# closed issue.
#
# `sort:created-asc` is load-bearing. A lane sorted this way is walked as a
# series of *first* pages, each asked from the creation time of the last row
# read (`created:>=`), and creation time never changes - so a row opening or
# closing between two pages cannot shift the boundary, as it can under
# GraphQL's offset cursor. Without the sort a lane walks by offset, with that
# caveat.
#
# `@me` is whoever holds the token, so these three can be shared as they
# stand. A lane of the same key in `data/config.toml` replaces it; a new key
# there is a fourth lane, walked after these. The first lane to claim a url
# keeps it.
mine     = "is:open is:pr author:@me archived:false sort:created-asc"
review   = "is:open is:pr review-requested:@me archived:false sort:created-asc"
assigned = "is:open is:issue assignee:@me archived:false sort:created-asc"

# Named filter sets for `'` in the browser. Eight are built in - the
# firehose, my work, the backlog, ready to merge, approved, second look
# theirs, second look mine, everything - and a table here adds one, or
# replaces a built-in of the same name. Every axis a view does not name is
# cleared when it is applied, so a name always means the same list. `'` then
# the last entry copies the TOML for the filter on screen, to paste into
# `data/config.toml`.
#
# The axes:
#   show   not-done, done, filed
#   state  open, closed
#   tag    reply, mentioned, review, edits, ready, approved, second, touched,
#          drafts, snoozed
#   kind   pr (a pull request that is not a draft), draft, issue, notice (a
#          notification that is neither - a release, a CI run - and `closed`
#          on `state`). Every pull request is `["pr", "draft"]`.
#   lane   which search claimed the row: the keys under `[lanes]`, plus
#          `imported`, `carried`, `activity` (only the poll saw it),
#          `notifications`, and `local` for an adopted branch
#   repo, label, author
#   sort   moved, latest, touched, name - by when it moved, by the later of
#          that and when you acted, by when you acted, by url. Unset, the
#          view opens in the order its selection implies, and `w` cycles
#          from there.
#
# `show` and `state` only ever add: each value brings its rows in beside the
# others. A row is under one value of each - `not-done` is the unfiled work
# that moved since you looked, `done` the rest of the unfiled work, `filed`
# what `x` put away; `open` or `closed` is GitHub's state - and is in when
# both are checked. A view naming neither gets not-done in both states,
# which is the firehose. One that names an axis names the whole of it:
# `show = ["not-done", "done"]` with `state = ["open"]` is the backlog, and
# `show = ["filed"]` is the filed work alone. An unknown axis or value is
# reported when the view is applied, not ignored.
#
# [views."subtyping, quiet"]
# tag = ["second"]
# repo = ["JuliaLang/julia"]
# label = ["types and dispatch"]

[filters]
# Repos listed first on the filter pane (`f`), in this order, whether or not
# they are applied - so each is in the same place every time, one `↵` away.
# Every other repo is behind the picker row under them. A name, or `owner/*`
# for every repo of that owner the dashboard has a row from. Yours, in
# `data/config.toml`.
pinned_repos = []

[events]
# Repositories polled for every comment and state change, so their email
# notifications can be turned off. An entry is a repo, `owner/name`, polled
# exactly with `since=` - lossless, since the cursor is ours - or `owner/*`,
# every repo that owner has, swept as two searches (issues, pull requests)
# rather than a poll per repo. The sweep pays for that with search's
# eventual consistency - a change can take minutes to be searchable, so it
# asks from fifteen minutes behind its cursor - and search's rate limit,
# thirty a minute; a sweep cut short carries on from where it got to on the
# next poll. A repo that has to be seen the moment it moves is named
# outright.
#
# Beside these, `/notifications` is polled the same way whenever the token
# is a person's and not a GitHub App's (README, *Authentication*). That is
# what reaches a closed thread outside every repo here, and a repo you watch
# on github.com and never listed. Those rows say `notifications` on the lane
# axis, with the reason GitHub gave under `why`.
#
# What none of this reaches: a Discussion, a Release or a commit comment is
# a notice, not an item; a repository the token cannot see stays a light
# row, asked again while it is unread; and a push, a label, a draft toggle
# or an unassignment on a row outside every repo here notifies nobody - so
# an open row of yours that no lane returns and no repo here covers is asked
# by url every refresh.
#
# Yours, in `data/config.toml`, and the list there is the whole list. With
# nothing here the dashboard is the three lanes and, when the token allows,
# your notifications. `wl watching` prints the repositories you watch on
# GitHub and have not listed, as lines to paste.
repos = []
# Whether a glob keeps the owner's forks. Keeping them is free - the sweep is
# the same search either way - while skipping them costs a repo listing per
# owner per day. false is the noise control for a glob that drags in other
# people's projects. A repo named outright above is never filtered.
include_forks = true
# How far back a source starts the *first* time it is seen, in days. 0 is
# inbox zero: naming a repository brings nothing unread with it, and
# everything after is caught by the cursor. What it does bring is its open
# list, as `backlog` rows - done by construction, and unread the moment one
# next moves; `wl refresh --backlog` does that for every repository here.
# Used once per source; after that the `source:` blocks in `data/local.toml`
# say where each is done up to.
backfill_days = 0
# The activity poll runs on every browser launch and is several paginated
# requests per repo, so a source is not polled again until this long after
# the last time.
activity_ttl_seconds = 120

[cache]
# On-disk cache of what the browser reads about one item - the thread, the
# diff, the reviewers, the checks. An entry is shown for `keep_days` and is
# current for `fresh_minutes`; past that it still goes up at once, and a
# re-read runs behind it once the item has been on screen for a second.
# Short by design: these are things people are actively replying to.
fresh_minutes = 2
keep_days = 30
# `mergeable` has a window of its own. A clean answer older than this is not
# shown at all - master moved, a check finished - and the pane waits on the
# question being asked again; a conflict stays as long as anything else.
merge_minutes = 10

[mouse]
# How far apart two presses can be, in seconds, and still be one double
# click - which copies in the list and the thread, and is `↵` in the pickers
# (`'`, `"`, the checkout chooser). Longer than a terminal's own, since a
# double click here copies rather than selects, and the slower window is
# the one that catches the gesture people actually make.
double_click_seconds = 0.5
# How fast a drag held past the top or bottom of the thread, or of a hosted
# pane, scrolls, in rows a second, whether or not the pointer moves.
drag_scroll_rows_per_second = 40

[agent]
# What `T` runs in a pane. The default is `$SHELL -ic claude`, because an
# agent is more often a shell alias or a function than a file on `PATH`:
# `-i` reads the rc file and turns alias expansion on, and `-c` puts the
# name in command position, where aliases expand. Leave it unset if your
# `claude` is an alias you want to stay in sync - a copy here would be a
# second definition to drift. Three keys say what runs, here and in each
# `[[agent.list]]` entry:
#
# `kind` - the program, run through that shell so an alias of its name
# resolves: `claude` unless set, `codex`, or whatever your shell calls the
# agent. `claude` alone also gets `--settings` with the *contents* of
# `cli/claude-settings.json` (a sandboxed `claude` cannot see this
# checkout): hooks that ring the pane's bell when a turn ends or a
# permission is asked, which is what makes the item unread (`why unread:
# agent`). Another kind gets nothing.
# kind = "codex"
#
# `args` - flags, added verbatim after the program, in the shell's syntax.
# This is the way to add one: `command = "$SHELL -ic claude --worktree-rw"`
# would run the bare alias, since `-c` takes one word as its script and the
# rest as `$0`, `$1`...
# args = "--worktree-rw"
#
# `command` - a whole line that replaces the lot, for a wrapper script, a
# path or a different shell. Only `args` and the prompt are added to it - no
# `--settings` - so a command that is still `claude` keeps the bell by
# reading the file itself. tmux runs it through the server's own shell, so
# that is its syntax:
# command = '/opt/homebrew/bin/claude --continue --settings "$(cat /path/to/git-worklog/cli/claude-settings.json)"'
#
# A new agent asks what it should do before it starts, and what is typed
# goes on its command line as the last argument, quoted, after `args`; `↵`
# with nothing typed starts it waiting. `tab` there picks among the agents
# listed here, starting on the first; with no list it is the one above. An
# entry with none of the three keys is that one too, so the list can name it
# beside others; an entry with no `name` is called by what it runs.
# [[agent.list]]
# name = "claude"
# [[agent.list]]
# name = "claude, in its own worktree"
# args = "--worktree-rw"
# [[agent.list]]
# kind = "codex"
# [[agent.list]]
# name = "claude, continuing"
# command = "claude --continue"
