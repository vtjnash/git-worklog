# Work dashboard configuration - the shared half.
#
# Two files, read as one. This one is versioned with the program and names
# nobody: every key, its default, and the comment that is its manual. The other
# is `data/config.toml`, yours, written once from `config.user.toml` the first
# time `wl` runs and never touched by the program again: your login, your
# theme, the repositories you poll and pin, and any key here you want otherwise.
#
# The merge is two levels deep. A top-level value in your file replaces the one
# here; a top-level table merges key by key; whatever sits under one of those
# keys replaces whole. So `[thresholds] reply_days` overrides one number,
# `[events] repos` in your file *is* the list and not additions to this one,
# and a `[views."name"]` of the same name replaces the view.

# Your GitHub login. Set in `data/config.toml`; nothing runs without it. It is
# how a row is read as yours or not - the lanes below do not need it, since
# `@me` in a search is whoever holds the token.
login = ""

# Which file under `themes/` the colours are read from. One name, and it is the
# only thing that turns colour on: an empty value, a missing key or a file that
# is not there draws everything plain, with no escapes printed at all - so
# `theme = ""` is the way to ask for that. A misspelt role or colour inside the
# file is reported on stderr at startup and drawn as nothing; the file itself
# says what the roles are and what a colour may be written as.
theme = "github-light-256.toml"

[thresholds]
# A mention this recent, with the last word not yours, is a question owed a reply.
reply_days = 30
# Silence this long, in *working* days, wants a second look: the author spoke or
# pushed and nobody answered, or somebody approved it and nothing happened after.
# Unlike a snooze this needs no asking for - the failure it catches is work going
# quiet without anyone deciding it should - and it is about an answer being
# owed, not about a pull request being old: there is no "stale" threshold here,
# because age alone is not a reason to be told about something.
second_look_days = 2
# There is no far end. `second_look_max_days` used to cap it at 20, so quiet
# past that stopped being reported at all - which meant a row left the lane on a
# day nobody chose and with nothing written down about it. The lane is newest
# first, so an old row is at the bottom rather than in the way, and taking one
# out is `s` `1`: a decision, recorded, reversible with `z`, and it comes back
# on its own when the thing finally moves.

[lanes]
# GitHub search syntax. Each lane is one paginated GraphQL search, and the
# three of them are the open work: what you wrote, what you were asked to
# review, what you were handed. Asked for whole on every refresh - `u` in the
# browser - because they do two things at once that nothing else does as
# cheaply: they find the standing set (a pull request of yours that nobody has
# touched notifies nobody) and they bring back everything the tags are made of,
# for every row in it - CI, the review threads, the draft flag - which change
# without any clock saying so. ~135 rows, 16 points, fifteen seconds.
#
# Everything else the dashboard shows is *not* searched for. It arrives through
# the clocks under `[events]` - the repositories polled there and, when the
# token allows, your GitHub notifications - and a row is fetched by url the
# first time a thread names you, and again only when a clock says it moved.
# Nothing leaves: the dashboard is the index of everything that was ever in
# front of you, read or unread - the `read` and `filed` boxes hold the read and
# the filed - and a finished pull request of yours stays, as does the mention
# on a years-old closed issue, which arrives the same way as one on an open one.
# Until 2026-09-13 there were nine more lanes here - three for what had recently
# closed, six searching for mentions and comments, and a firehose of every open
# julia pull request - two thousand rows fetched every six hours so the ones
# that moved could be noticed. A row you want that nothing here returns is `i`:
# an import, fetched by url from then on.
#
# `sort:created-asc` on each, and it is load-bearing: `search` reads a lane
# sorted this way as a series of *first* pages, each asked from the creation
# time of the last row read (`created:>=`), rather than by GraphQL's offset
# cursor over a list that the set can shift under - a pull request of yours
# closing mid-walk used to slip one row past a page boundary for a run, and a
# reopen beside it hid even the count. Creation time never changes, so the
# boundary holds whatever opens or closes between two pages. Without the
# sort a lane walks by offset, with that caveat. The windowed walks in
# `events.jl` are ascending by `updated`
# instead, so that an item touched mid-walk moves to the end and is read
# again with its new stamp in the same poll; their cursor is the poll's start
# time, which is safe in any order, and the ascending order only saves the
# re-read. These lanes have no cursor - the whole set, every run - so the
# order that never moves is the right one.
#
# `@me` is GitHub's: the user the token belongs to, in `author:`, `assignee:`,
# `review-requested:` and the rest. It is why these three can be shared as
# they stand. A lane in `data/config.toml` under the same key replaces the one
# here, and a new key there is a fourth lane, walked after these; the first
# lane to claim a url keeps it.
mine     = "is:open is:pr author:@me archived:false sort:created-asc"
review   = "is:open is:pr review-requested:@me archived:false sort:created-asc"
assigned = "is:open is:issue assignee:@me archived:false sort:created-asc"

# Named filter sets for `'` in the browser. Ten are built in - notification
# firehose, my work, open items, waiting on me, waiting on them, ready to merge,
# needs edits mine, unanswered, snoozed, everything - and a table here adds one,
# or replaces a built-in of the same name. Every axis the view does not name is cleared when
# it is applied, so a name always means the same list. `'` then the last entry
# copies the TOML for whatever filter you are looking at, to paste into
# `data/config.toml`; the browser never writes that file.
#
# The axes: `show` (base, read, filed, done), `tag` (reply, review, edits,
# ready, second, touched, drafts, snoozed), `kind`, `lane`, `repo`, `label`,
# `author`, `sort`. `lane` is which search claimed the row - the keys under
# `[lanes]`, plus `imported`, `carried`, `activity` for a row only the poll
# saw, `notifications` for one GitHub notified you of, and `local` for an
# adopted branch. `sort` is one of `moved`, `latest`, `touched`, `name` - by
# when it moved, by the later of that and when you acted, by when you acted,
# by url - and a view that names none opens in the order its selection
# implies: the three built-in views each open in the order made for them,
# and `w` cycles from there.
#
# `show` is the one that only ever adds: each value brings a kind of row in
# beside the others, and none of them takes another's rows away. `base` is the
# unread, unfiled and open work this dashboard is for, and `done` is the closed
# rows; a view that names no `show` at all gets both - unread and unfiled,
# open or closed, which is the notification list and is what the firehose is,
# so it names nothing. A view that does name `show` names the whole of it,
# `base` included: `show = ["base", "read"]` is the open work with the read
# ones beside it and no closed row at all - the backlog - and `show = ["filed"]`
# is the filed work on its own. An axis or a value that is not one of the above is
# reported when the view is applied rather than ignored - `seen`, `sleep` and
# `state` were three axes here until they merged, and a view still naming one
# would otherwise go on being applied and mean something else.
#
# [views."subtyping, quiet"]
# tag = ["second"]
# repo = ["JuliaLang/julia"]
# label = ["types and dispatch"]

[filters]
# Repos listed on the filter pane (`f`) whether or not they are applied, first
# and in this order, at zero too - so each is in the same place every time,
# one `↵` away. Every other repo is behind the picker row under them. A name,
# or `owner/*` for every repo of that owner the dashboard has a row from.
# Yours, in `data/config.toml`; none by default.
pinned_repos = []

[events]
# Every comment and state change in these repos is logged locally, so the
# per-event email notifications can be turned off. Polled with `since=`, which
# is lossless - the cursor is ours, so nothing is missed because it was read
# somewhere else. Volume is ~300 events/week across these.
# An entry is either a repo, polled exactly with `since=`, or `owner/*`, which
# is every repo that owner has. A glob is asked as two searches - one for issues
# and one for pull requests - rather than as a poll per repo: `vtjnash/*` is two
# hundred repos, and two hundred requests on every browser launch is not a thing
# to do for a handful of comments. The cost is search's eventual consistency -
# a change can take minutes to be searchable, and the sweep asks from fifteen
# minutes behind its cursor for that - and the search rate limit, thirty a
# minute; not the 1000-row cap, since a sweep cut short answers with where it
# got to and the rest is the next poll's. A repo that has to be seen the
# moment it moves is still named here.
# Beside these, and not configured here: `/notifications` itself is polled the
# same way whenever the token is a person's and not a GitHub App's - `gh auth
# token` off the sandbox; the sandbox's own token cannot read it, and there the
# source is skipped and says so, unless `data/notifications.token` holds one
# that can, which is not a file to keep where others can read it. That is
# what reaches a closed thread outside every repo below, and a repo watched on
# github.com and never listed here. Those rows say `notifications` on the lane
# axis, and the reason GitHub gave under `why`. The list stays the statement of
# what is polled exactly.
#
# What none of this reaches, said plainly: a Discussion, a Release, a commit
# comment - the notifications source sees each arrive and skips it, since
# nothing here can open one; a repository the `gh` token cannot see, which the
# notifications token may - such a thread stays a light row and is asked again
# while it is unread; and a push, a label, a draft toggle or an unassignment on
# a row outside every repo here, which notify nobody - so an open row of yours
# that no lane returns and no repo here covers is asked by url every refresh.
#
# Yours, in `data/config.toml` - the list there is the whole list. None by
# default: with nothing here the dashboard is the three lanes and, when the
# token allows, your notifications. `wl watching` prints the repositories you
# watch on GitHub and have not listed, as lines to paste.
repos = []
# Whether a glob keeps the owner's forks. Keeping them is free: the sweep is the
# same one search either way and spends no GraphQL points - those go on the
# refresh lanes - while *skipping* them costs a repo listing per owner per day,
# to tell which is which. So they are kept, and false is the noise control for
# when a glob starts dragging in other people's projects: 171 of the repos under
# `vtjnash/*` are forks, though none has produced an item in months. A repo
# named outright above is never filtered either way.
include_forks = true
# How far back a source starts the *first* time it is seen. 0 is inbox zero:
# turning one on brings nothing with it, and everything after that is caught by
# the cursor. Only ever used once per source; after that the `source:` blocks in
# `data/local.toml` say where each one has been read up to.
#
# 0 since 2026-09-14, as policy: the unread side starts at now. It was 30
# while the corpus was rebuilt from nothing, and a month of a repository's
# traffic arriving unread at once is not what naming it should mean. What the
# dashboard remembers is the corpus, which nothing leaves; and what a repository
# named here brings with it is its **open list** - every open issue and pull
# request, as `backlog` rows, read by construction and unread the moment one
# next moves - on its first sight, and for every repository here on
# `wl refresh --backlog`. The backlog view is that standing list; the dashboard
# is only what moved.
backfill_days = 0
# The activity query runs on every browser launch and is several paginated
# requests per repo, so a source is not re-polled until this long after the last
# one. It used to be a cache keyed by the cursor as well, which is gone: the
# cursor moves every poll, so every entry was written once and never read again.
activity_ttl_seconds = 120

[cache]
# On-disk cache for what the browser reads about one item - the thread, the
# diff, the reviewers, the checks - which it hits repeatedly as you move over
# the same items. An entry is shown for `keep_days` and is *current* for
# `fresh_minutes`: past that it still goes up at once, and a re-read runs
# behind it once the item has been on screen for a second. Short by design:
# these are things people are actively replying to.
fresh_minutes = 2
keep_days = 30
# `mergeable` has a window of its own. A clean answer past this is not shown at
# all - master moved, a check finished - and the pane waits on the question
# being asked again; a conflict stays as long as anything else does.
merge_minutes = 10

[agent]
# What `T` runs in a pane. The default is `$SHELL -ic claude`, because an agent
# is more often a shell alias or a function than a file on `PATH`. Both parts of
# `-ic` matter: without `-i` the shell reads no rc file *and* has alias
# expansion off, and with `exec` in front the alias would not be looked up at
# all, since aliases expand in command position only.
#
# Leave it unset if your `claude` is a shell alias you want to stay in sync -
# reading it is the whole point, and a copy here would be a second definition to
# drift. Set it when the agent is not what your shell calls `claude` at all: a
# different agent, a wrapper script, a command with flags. In `data/config.toml`:
# command = "/opt/homebrew/bin/claude --continue"
#
# The default also passes `--settings cli/claude-settings.json`: hooks that ring
# the pane's bell when a turn ends or a permission is asked, which is how the
# worktree list and the item pane show an agent waiting on you (yellow `T`).
# A command of your own that is still `claude` keeps that by naming the file:
# command = "claude --continue --settings /path/to/git-worklog/cli/claude-settings.json"
