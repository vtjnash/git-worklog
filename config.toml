# Work dashboard configuration.
# Edited by you. The refresh only ever reads this file.

login = "vtjnash"

[thresholds]
# Your PR has been green and waiting on a reviewer this long -> needs-nudge.
nudge_days = 7
# No activity at all this long -> flagged stale in the view.
stale_days = 60
# A mention this recent, with the last word not yours, is a question owed a reply.
reply_days = 30
# Silence this long, in *working* days, wants a second look: the author spoke or
# pushed and nobody answered, or somebody approved it and nothing happened after.
# Unlike a snooze this needs no asking for - the failure it catches is work going
# quiet without anyone deciding it should - and unlike `nudge_days` it is about
# an answer being owed rather than about a pull request being old.
second_look_days = 2
# There is no far end. `second_look_max_days` used to cap it at 20, so quiet
# past that stopped being reported at all - which meant a row left the lane on a
# day nobody chose and with nothing written down about it. The lane is newest
# first, so an old row is at the bottom rather than in the way, and taking one
# out is `s` `1`: a decision, recorded, reversible with `z`, and it comes back
# on its own when the thing finally moves.

[lanes]
# GitHub search syntax. Each lane is one paginated GraphQL search.
mine     = "is:open is:pr author:vtjnash archived:false"
review   = "is:open is:pr review-requested:vtjnash archived:false"
assigned = "is:open is:issue assignee:vtjnash archived:false"
# Recently finished. Without these a pull request that merged between two
# refreshes is never seen at all: every lane above is `is:open`, so it simply
# stops being returned and the merge goes unnoticed. `{since:N}` is the date N
# days before the run, so these stay bounded - unbounded they are every pull
# request you have ever had. They land in the `done` bucket, where `x` files
# them away.
landed   = "is:pr author:vtjnash is:closed closed:>{since:21} archived:false"
reviewed = "is:pr review-requested:vtjnash is:closed closed:>{since:14} archived:false"
resolved = "is:issue assignee:vtjnash is:closed closed:>{since:14} archived:false"

[firehose]
repo = "JuliaLang/julia"
# Not a filter - a ranking signal. `wl next` hands you these areas first.
areas = [
  "compiler:codegen", "compiler:llvm", "compiler:optimizer", "compiler:inference",
  "compiler:effects", "compiler:lowering", "compiler:precompilation",
  "GC", "GC: MMTK", "multithreading", "atomics", "invalidations",
  "types and dispatch", "ffi", "embedding", "juliac", "trimming",
  "latency", "caching",
]

[bulk]
# Big, slow-moving queries. ~2000 items between them, so they run on their own
# cadence rather than every refresh; force with `cli/bin/refresh --firehose`.
# Nothing fetched here surfaces on its own - it all lands in the background pile
# and is reached only through `wl next`. The one exception is a recent mention
# whose last comment is not yours, which becomes a `needs-reply`.
refresh_hours = 6

[bulk.queries]
firehose        = "repo:JuliaLang/julia is:open is:pr archived:false"
mentioned_pr    = "is:open is:pr mentions:vtjnash archived:false"
mentioned_issue = "is:open is:issue mentions:vtjnash archived:false"
commented_pr    = "is:open is:pr commenter:vtjnash archived:false"
commented_issue = "is:open is:issue commenter:vtjnash archived:false"
# Team mentions, which `mentions:` does not cover - it matches the user, not a
# team they are on. `team:ORG/TEAM` is a real qualifier but needs a token with
# org read, and returns nothing with an App installation token; searching for
# the literal text needs no such thing and finds the same mentions in comments
# as well as bodies. The lane name starts with `mentioned` on purpose: that is
# what the bucketing rule keys on, so a team mention whose last word is not
# yours becomes a needs-reply exactly like a personal one. Add teams with OR.
# Two lanes and not one: a GraphQL search without `is:pr` or `is:issue` returns
# zero, free text included, which is the same trap `assignee:` falls into.
mentioned_team_pr    = "is:open is:pr in:body,comments archived:false \"@JuliaLang/compiler\" OR \"@JuliaLang/triage\""
mentioned_team_issue = "is:open is:issue in:body,comments archived:false \"@JuliaLang/compiler\" OR \"@JuliaLang/triage\""

# Named filter sets for `'` in the browser. Nine are built in - notification
# firehose, my work, open items, waiting on me, waiting on them, ready to merge,
# red CI mine, unanswered, everything - and a table here adds one, or replaces a
# built-in of the same name. Every axis the view does not name is cleared when
# it is applied, so a name always means the same list. `'` then the last entry
# copies the TOML for whatever filter you are looking at, to paste in here; the
# browser never writes this file.
#
# The axes: `show` (base, read, snoozed, filed, done), `tag` (second, touched,
# drafts), `kind`, `bucket`, `repo`, `label`, `author`, `sort`.
#
# `show` is the one that only ever adds: each value brings a kind of row in
# beside the others, and none of them takes another's rows away. `base` is the
# unread, awake and open work this dashboard is for, and it is what a view that
# names no `show` at all gets - so the firehose names nothing. A view that does
# name `show` names the whole of it, `base` included: `show = ["base", "read"]`
# is today's work with the read ones beside it, and `show = ["filed"]` is the
# filed work on its own. An axis or a value that is not one of the above is
# reported when the view is applied rather than ignored - `seen`, `sleep` and
# `state` were three axes here until they merged, and a view still naming one
# would otherwise go on being applied and mean something else.
#
# [views."subtyping, quiet"]
# tag = ["second"]
# repo = ["JuliaLang/julia"]
# label = ["types and dispatch"]

[backlog]
# Default size of `wl next`, the pull-based backlog queue.
batch = 10

[events]
# Every comment and state change in these repos is logged locally, so the
# per-event email notifications can be turned off. Polled with `since=`, which
# is lossless - the cursor is ours, so nothing is missed because it was read
# somewhere else. Volume is ~300 events/week across these.
# An entry is either a repo, polled exactly with `since=`, or `owner/*`, which
# is every repo that owner has. A glob is asked as two searches - one for issues
# and one for pull requests - rather than as a poll per repo: `vtjnash/*` is two
# hundred repos, and two hundred requests on every browser launch is not a thing
# to do for a handful of comments. The cost is fidelity, since search truncates
# at 1000 results, so a repo that has to be seen exactly is still named here.
repos = [
  "JuliaLang/julia",
  "libuv/libuv",
  "JuliaCI/julia-buildkite",
  "JuliaLang/Distributed.jl",
  "vtjnash/*",
  "libuv/*",
]
# Whether a glob keeps the owner's forks. Keeping them is free: the sweep is the
# same one search either way and spends no GraphQL points - those go on the
# refresh lanes - while *skipping* them costs a repo listing per owner per day,
# to tell which is which. So they are kept, and false is the noise control for
# when a glob starts dragging in other people's projects: 171 of the repos under
# `vtjnash/*` are forks, though none has produced an item in months. A repo
# named outright above is never filtered either way.
include_forks = true
# How far back a source starts the *first* time it is seen. 0 is inbox zero:
# turning one on brings nothing with it, and everything after that is caught by
# the cursor. Only ever used once per source; after that `inbox.json` says where
# each one has been read up to.
#
# 30 because the inbox was rebuilt from nothing on 2026-09-10 and a month is
# what makes that worth doing - inbox zero on a cold start is an empty dashboard
# that fills up over the following week. It stays in effect for any source added
# from here on, which is the same trade: a repo named for the first time arrives
# with a month of its history rather than with nothing.
backfill_days = 30
# The activity query runs on every browser launch and is several paginated
# requests per repo, so a source is not re-polled until this long after the last
# one. It used to be a cache keyed by the cursor as well, which is gone: the
# cursor moves every poll, so every entry was written once and never read again.
activity_ttl_seconds = 120

[cache]
# On-disk cache for thread and diff reads, which the browser hits repeatedly as
# you move over the same items. Short by design: these are things people are
# actively replying to.
detail_ttl_minutes = 10

[agent]
# What `T` runs in a pane. The default is `$SHELL -ic claude`, because an agent
# is more often a shell alias or a function than a file on `PATH`. Both parts of
# `-ic` matter: without `-i` the shell reads no rc file *and* has alias
# expansion off, and with `exec` in front the alias would not be looked up at
# all, since aliases expand in command position only.
#
# Leave it unset if your `claude` is a shell alias you want to stay in sync -
# reading it is the whole point, and a copy here would be a second definition to
# drift. Set it when the agent is not what your shell calls `claude` at all: a
# different agent, a wrapper script, a command with flags.
# command = "/opt/homebrew/bin/claude --continue"
