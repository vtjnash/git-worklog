# Work dashboard configuration.
# Edited by you. refresh.py only ever reads this file.

login = "vtjnash"

[thresholds]
# Your PR has been green and waiting on a reviewer this long -> needs-nudge.
nudge_days = 7
# No activity at all this long -> flagged stale in the view.
stale_days = 60

[lanes]
# GitHub search syntax. Each lane is one paginated GraphQL search.
mine     = "is:open is:pr author:vtjnash archived:false"
review   = "is:open is:pr review-requested:vtjnash archived:false"
assigned = "is:open is:issue assignee:vtjnash archived:false"

[firehose]
# EVERY open PR in this repo lands in the background pile. Nothing here ever
# surfaces on its own; you reach it only through `wl.py next`.
repo = "JuliaLang/julia"
# Fetched on its own cadence, not every refresh (it is ~1000 PRs and ~70s).
# Force with: python3 refresh.py --firehose
refresh_hours = 6
# Not a filter - a ranking signal. `wl.py next` hands you these areas first.
areas = [
  "compiler:codegen",
  "compiler:llvm",
  "compiler:optimizer",
  "compiler:inference",
  "compiler:effects",
  "compiler:lowering",
  "compiler:precompilation",
  "GC",
  "GC: MMTK",
  "multithreading",
  "atomics",
  "invalidations",
  "types and dispatch",
  "ffi",
  "embedding",
  "juliac",
  "trimming",
  "latency",
  "caching",
]

[backlog]
# Default size of `wl.py next`, the pull-based backlog queue. Nothing from the
# backlog is ever pushed into the dashboard; you ask for a batch when you want one.

batch = 10
