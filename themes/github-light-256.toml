# GitHub's colours on a light terminal, as 256-colour indices.
#
#     theme = "github-light-256.toml"
#
# The other shipped theme, `default-ansi.toml`, names the sixteen ANSI colours
# and so is drawn in whatever scheme the terminal is set to. This one does the
# opposite on purpose: every colour here is a fixed index into the 256-colour
# cube, chosen as the nearest entry to the hex in GitHub's Primer palette, so
# the dashboard looks the same in every terminal that has 256 colours. The cube
# is exact and not a matter of taste - indices 16-255 are defined values, unlike
# 0-15, which the terminal owns - so an index is a colour promised rather than
# requested. That is the whole of what `-256` in the name means, and it is also
# the catch: these colours are picked for a *light* ground, and on a dark one
# the greys and the near-blacks below are unreadable. `github-dark-256.toml` is
# the same palette for that case.
#
# Nothing here is pure black or pure white. GitHub's text is #1f2328 and its
# canvas is #ffffff, so the darkest thing in the file is 235 (#262626) and the
# background is left to the terminal - a theme has no role for the canvas, and
# painting one behind every row would fight whatever the terminal is set to
# rather than follow it.
#
# The roles and the spec language are `default-ansi.toml`'s; that file is the
# one to read for what a role *means*. This one records which GitHub colour each
# role was given and why, where the answer is not obvious.

# --- weight and quiet --------------------------------------------------------
# `bold` carries the Primer foreground rather than the attribute alone: on a
# fixed palette the text colour is part of the theme, and #1f2328 -> 235 is a
# shade off black in the way GitHub's is. `dim` is fg.muted (#59636e -> 241),
# a grey foreground and not the `dim` attribute - which is the better choice
# here anyway, since terminals disagree about what `dim` does and one of the
# answers is "nothing". `focus` is the loudest thing on the screen, and on a
# light ground that is black, not white.
bold  = "bold 235"
dim   = "241"
focus = "bold 16"

# --- the three verdicts, and a name ------------------------------------------
# success.fg, danger.fg and attention.fg, which on a light ground are darker
# than the words for them suggest: GitHub's attention is #9a6700, an olive, and
# not a yellow - a yellow on white cannot be read. `accent` is accent.fg, the
# blue everything nameable on GitHub is written in.
settled = "29"
blocked = "160"
waiting = "94"
accent  = "26"

# --- the diff ----------------------------------------------------------------
# Foregrounds, though GitHub's diff is backgrounds: a line here is styled to the
# end of its text and not to the end of the pane, so a tinted row would stop
# mid-line and leave a ragged right edge. The green and the red are the same
# success/danger pair as the verdicts above, which is what GitHub does too.
# `diff_hunk` is the accent blue; `diff_meta` is fg.subtle, quieter than `dim`.
diff_add  = "29"
diff_del  = "160"
diff_hunk = "26"
diff_meta = "245"
# neutral.muted, the grey GitHub puts behind an inline code span. A step darker
# than `cursor_bg` so that a span on the row under the cursor is still marked.
code_bg = "on 253"

# --- where you are -----------------------------------------------------------
# The cursor row is canvas.subtle, the barely-there grey GitHub hovers a list
# row with. The selection is the blue it drags text in, and a search hit is
# attention.subtle - the yellow of a highlighted match - with the text on it
# forced dark, since the row underneath may have a colour of its own.
cursor_bg = "on 255"
select_bg = "on 153"
match_bg  = "235 on 230"
caret     = "reverse"

# --- links -------------------------------------------------------------------
link = "underline"
url  = "25"

# --- Term's own palette ------------------------------------------------------
# The markdown in a comment body. GitHub renders headings in the text colour
# and not in a colour of their own - only h6 is muted - which works on a page
# because the size falls with the level, and does not in a terminal, where
# every heading is one line of the same size. So the weight falls instead:
# bold text, then bold muted, then muted, with h2 underlined for the rule
# GitHub draws under it.
[term]
md_h1 = "bold 235"
md_h2 = "bold 235 underline"
md_h3 = "bold 235"
md_h4 = "bold 241"
md_h5 = "bold 241"
md_h6 = "241"
md_quote = "241"
md_footnote = "26"
md_latex = "94 italic"
# Emphasis is the attribute and nothing else, which is exactly what GitHub does
# with `**bold**` and `*italic*`: the colour of a sentence does not change
# because part of it is stressed.
emphasis = "bold"
emphasis_light = "italic"
text_accent = "235"
text = ""
line = ""
link = "underline 26"

# A code block Term draws itself, inside a list or a quote. canvas.subtle again.
md_codeblock_bg = "255"

# Tables, and the admonition boxes. The border grey is GitHub's #d1d9e0, nudged
# one step darker than the nearest index: on a white ground the exact match is
# faint enough to disappear, and a box whose edges cannot be seen is not a box.
md_table_header = "bold 235"
tb_style = "250"
tb_header = "bold 235"
tb_columns = ""
tb_footer = ""
# GitHub's five alerts are Note (blue), Tip (green), Important (purple),
# Warning (yellow) and Caution (red). Term has five too but names them
# differently, so `info` takes the purple: it is the one left over, and
# Important is the alert it is closest to.
md_admonition_note = "26"
md_admonition_info = "98"
md_admonition_warning = "94"
md_admonition_danger = "160"
md_admonition_tip = "29"

# Box characters, not colours. Rounded, because GitHub's own boxes are.
box = "ROUNDED"
tb_box = "MINIMAL_HEAVY_HEAD"

# --- code, which is a third palette ------------------------------------------
# Primer's syntax colours, by their old `.pl-` class names: keyword #cf222e,
# string #0a3069, constant #0550ae, entity #8250df, comment #6e7781. The string
# navy is the one place the nearest index by distance (23, a teal) is the wrong
# answer and a slightly further one (18) is the right one - a string that comes
# out green-blue reads as a different token, and hue matters more here than
# distance does.
#
# `operator` is red with the keywords, which is where GitHub puts it.
[code]
text = "235"
keyword = "160"
boolean = "25"
constant = "25"
function = "98"
macro = "98"
operator = "160"
punctuation = "241"
string = "18"
character = "18"
comment = "243"
number = "25"
